version: 0.2
env:
  parameter-store:
    github_app_id: /DEVOPS/INSIDER_DEVOPS_READER_GH_APP/GITHUB_APP_ID
    github_installation_id: /DEVOPS/INSIDER_DEVOPS_READER_GH_APP/GITHUB_APP_INSTALLATION_ID
    github_private_key: /DEVOPS/INSIDER_DEVOPS_READER_GH_APP/GITHUB_APP_PRIVATE_KEY
    ssh_key: /DEVOPS/ID_RSA
    ssh_pub: /DEVOPS/ID_RSA_PUB
    aws_access_key_id: /DEVOPS/AWS_ACCESS_KEY_ID
    aws_secret_access_key: /DEVOPS/AWS_SECRET_ACCESS_KEY
    aws_kube_config: /DEVOPS/AWS_CLUSTERS_KUBE_CONFIG
phases:
  install:
    commands:
      - echo "[INFO] STARTED TO RUN INSTALL PHASE"
      - echo "$PHASE_INSTALL_COMMANDS" | base64 --decode > /tmp/install_phase.sh
      - chmod +x /tmp/install_phase.sh
      - bash -e /tmp/install_phase.sh
      - echo "[INFO] INSTALL PHASE COMPLETED"
  pre_build:
    commands:
      - |
        if [ -z "$aws_kube_config" ]; then
            echo "Error: Environment variable aws_kube_config is not set."
            exit 1
        fi
      - mkdir -p /root/.kube
      - echo "$aws_kube_config" > /root/.kube/config
      - chmod 600 /root/.kube/config
      - KUBE_CONTEXT=$(echo "$VISION_PARAMETERS" | awk -F'--kube-context ' '{print $2}' | awk '{print $1}' 2>/dev/null)
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 539389951722.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=539389951722.dkr.ecr.us-east-1.amazonaws.com/web/maildev
      - aws ecr describe-repositories --repository-names $(echo $REPOSITORY_URI | cut -c46-) 2>&1 > /dev/null || aws ecr create-repository --repository-name $(echo $REPOSITORY_URI | cut -c46-)
      - IMAGE_TAG=$(echo $NAMESPACE-v$CODEBUILD_BUILD_NUMBER)
      - find . \( -type d -name .git -prune \) -o -type f -print0 | xargs -0 sed -i 's/inone.useinsider.com/inone.insidethekube.com/g;s/api.useinsider.com/api.insidethekube.com/g;s/inone.devops.useinsider.com/inone.insidethekube.com/g'
  build:
    commands:
      - echo Build started on `date`
      - echo Building the maildev Docker image...
      - docker build -f Dockerfile -t $REPOSITORY_URI:$IMAGE_TAG . --add-host registry.devops.internal.web:52.50.104.74 --add-host os.registry.devops.internal.web:52.50.104.74
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - |
        # SEL-38510: a maildev Deployment left by another release (an atlas
        # release that still bundles it) would make the install below fail.
        # Atlas drops it when it reinstalls with maildev.enabled=false; give
        # it 20 minutes, then fail loudly instead of installing over it.
        KUBECTL_CONTEXT=""
        if [ -n "$KUBE_CONTEXT" ]; then KUBECTL_CONTEXT="--context=$KUBE_CONTEXT"; fi
        for attempt in $(seq 1 80); do
          OWNER=$(kubectl get deployment maildev --namespace=$NAMESPACE $KUBECTL_CONTEXT -o jsonpath='{.metadata.labels.app\.kubernetes\.io/instance}' 2>/dev/null || true)
          if [ -z "$OWNER" ] || [ "$OWNER" = "maildev" ]; then break; fi
          echo "deployment/maildev in $NAMESPACE still belongs to the $OWNER release, waiting ($attempt/80)"
          sleep 15
        done
        if [ -n "$OWNER" ] && [ "$OWNER" != "maildev" ]; then
          echo "[FATAL] deployment/maildev in $NAMESPACE belongs to the $OWNER release; it must be installed with maildev.enabled=false"
          exit 1
        fi
      - echo Deploying helm into cluster
      - cd $CODEBUILD_SRC_DIR/../helm-repository/maildev
      - helm dependency update
      - helm dependency build
      - |
        MAILDEV_IMAGE_FLAGS="--set image.repository=$REPOSITORY_URI --set image.tag=$IMAGE_TAG"
        helm upgrade --install maildev . \
          --namespace=$NAMESPACE \
          --create-namespace \
          --set env.COMMIT_HASH=$CODEBUILD_RESOLVED_SOURCE_VERSION \
          $MAILDEV_IMAGE_FLAGS \
          $VISION_PARAMETERS \
          --wait \
          --timeout 20m
      - printf '[{"name":"nodejs","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
